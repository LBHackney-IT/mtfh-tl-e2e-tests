version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  aws-cli: circleci/aws-cli@2.0.3
  cypress: cypress-io/cypress@3.1.3

parameters:
  run_workflow_ci:
    description: The default behaviour of the pipeline when a commit and/or merge is performed.
    default: true
    type: boolean

  upstream_pipeline_name:
    description: The name of the mfe that triggered the tests upstream.
    default: ""
    type: string

  external_trigger:
    description: Pipeline triggered externally
    default: false
    type: boolean

  development_environment:
    default: false
    type: boolean

  staging_environment:
    default: false
    type: boolean

  production_environment:
    default: false
    type: boolean

references:
    workspace_root: &workspace_root '~'
    attach_workspace: &attach_workspace
        attach_workspace:
            at: *workspace_root

executors:
    docker-python:
        docker:
            - image: circleci/python:3.7
    cypress-browsers:
        docker:
            # Pinned to Node 24.17.0 — keep in sync with .nvmrc and package.json engines
            - image: cypress/browsers:node-24.17.0-chrome-149.0.7827.155-1-ff-152.0-edge-149.0.4022.69-1
        resource_class: medium+
    docker-terraform:
        docker:
            - image: "hashicorp/terraform:light"

commands:
    # cypress/browsers Node 24+ images omit curl by design (see cypress-io/cypress-docker-images#852).
    # Required by circleci/aws-cli orb and trigger-downstream-deployment.
    install-system-deps:
        description: 'Install OS packages required by AWS CLI and pipeline scripts'
        steps:
            - run:
                name: Install curl and unzip
                command: apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates

    assume-role-and-persist-workspace:
        description: 'Assume a deployment role into a named AWS profile and persist ~/.aws'
        parameters:
            aws-account:
                type: string
            profile-name:
                type: string
                default: default
            attach-existing-workspace:
                type: boolean
                default: false
        steps:
            - when:
                condition: <<parameters.attach-existing-workspace>>
                steps:
                  - *attach_workspace
            - checkout
            - run:
                name: Stash existing AWS credentials
                command: |
                  if [ -f "$HOME/.aws/credentials" ]; then
                    cp "$HOME/.aws/credentials" /tmp/aws-credentials.existing
                  fi
            - aws_assume_role/assume_role:
                  account: <<parameters.aws-account>>
                  profile_name: <<parameters.profile-name>>
                  role: 'LBH_Circle_CI_Deployment_Role'
            - run:
                name: Merge AWS profiles
                command: |
                  if [ -f /tmp/aws-credentials.existing ]; then
                    PROFILE="<<parameters.profile-name>>"
                    cp "$HOME/.aws/credentials" /tmp/aws-credentials.new
                    cp /tmp/aws-credentials.existing "$HOME/.aws/credentials"
                    # Orb often also writes [default]; only append the profile we just assumed
                    awk -v p="[$PROFILE]" '
                      $0 == p { keep=1; print; next }
                      /^\[/ { keep=0 }
                      keep
                    ' /tmp/aws-credentials.new >> "$HOME/.aws/credentials"
                  fi
                  echo "AWS profiles:" && grep -E '^\[' "$HOME/.aws/credentials" || true
            - persist_to_workspace:
                  root: *workspace_root
                  paths:
                      - .aws

    execute-e2e-tests:
        description: 'Run e2e tests'
        parameters:
          stage:
            type: string
          trigger-context:
            type: string
        steps:
            - run:
                name: Execute e2e tests
                command: |
                          if [ "<<parameters.stage>>" = "production" ]
                            then export CYPRESS_E2E_ACCESS_TOKEN_PRODUCTION=$AUTH_TOKEN_PRODUCTION
                          elif [ "<<parameters.stage>>" = "staging" ]
                            then export CYPRESS_E2E_ACCESS_TOKEN_STAGING=$AUTH_TOKEN_STAGING
                          else 
                            export CYPRESS_E2E_ACCESS_TOKEN_DEVELOPMENT=$AUTH_TOKEN_DEVELOPMENT
                          fi

                          # New auth credentials to retrieve the token
                          # TODO: change to param store once we decide this is ready for staging
                          export CYPRESS_AWS_REGION=$AWS_REGION
                          export CYPRESS_E2E_CLIENT_ID=$E2E_CLIENT_ID
                          export CYPRESS_E2E_USERNAME=$E2E_USERNAME
                          export CYPRESS_E2E_PASSWORD=$E2E_PASSWORD

                          # Cognito flow feature toggle specifyin list of environments to enable the flow for
                          export CYPRESS_COGNITO_FLOW_ENABLED_FOR=$COGNITO_FLOW_ENABLED_FOR

                          # The rest of legacy configuration
                          export CYPRESS_FEATURE_TOGGLE_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/configuration-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_ASSET_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/property-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_HOUSE_SEARCH_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/house-search-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_CONTACT_DETAILS_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/contact-details-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_EQUALITY_DETAILS_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/equality-information-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_PERSON_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/person-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_TENURE_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/tenure-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_CAUTIONARY_ALERT_ENDPOINT=$(aws ssm get-parameter --name /housing-tl/<<parameters.stage>>/cautionary-alerts-api-url --query Parameter.Value --output text) ;
                          export CYPRESS_ENVIRONMENT=<<parameters.stage>> ;
                          export CYPRESS_AWS_SECRET_ACCESS_KEY=$(aws configure get aws_secret_access_key --profile default) ;
                          export CYPRESS_AWS_ACCESS_KEY_ID=$(aws configure get aws_access_key_id --profile default) ;
                          export CYPRESS_AWS_SESSION_TOKEN=$(aws configure get aws_session_token --profile default) ;
                          
                          if [ "<<parameters.trigger-context>>" = "external" ] && [ "<<parameters.stage>>" = "production" ]; then
                            # Production runs only @Production-tagged tests (home.cy.js); no MFE/smoke filter.
                            export GREP_TAGS='@Production+-@ignore+-@device'
                            export CYPRESS_SPEC='cypress/e2e/home.cy.js'
                          elif [ "<<parameters.trigger-context>>" = "devices" ]; then
                            export GREP_TAGS='-@GoogleLighthouse+-@Accessibility+-@ignore+@device'
                          else
                            export GREP_TAGS='-@GoogleLighthouse+-@Accessibility+-@ignore+-@device'
                            export PIPELINE_FILTER="$(echo << pipeline.parameters.upstream_pipeline_name >> | sed 's,https://github.com/LBHackney-IT/mtfh-frontend-,,g')"
                            if [ -n "$PIPELINE_FILTER" ]; then
                              ( [ "$PIPELINE_FILTER" = "common" ] || [ "$PIPELINE_FILTER" = "cognito-authentication" ] || [ "$PIPELINE_FILTER" = "root" ] ) && export PIPELINE_FILTER="SmokeTest"
                              export GREP_TAGS="$GREP_TAGS+@$PIPELINE_FILTER"
                            fi
                          fi

                          npm ci ;
                          echo "Running against $CYPRESS_ENVIRONMENT environment with tags $GREP_TAGS" ;
                          CYPRESS_ARGS=(run --expose "grepTags=${GREP_TAGS},grepFilterSpecs=true,grepOmitFiltered=true")
                          [ -n "$CYPRESS_SPEC" ] && CYPRESS_ARGS+=(--spec "$CYPRESS_SPEC")
                          ./node_modules/.bin/cypress "${CYPRESS_ARGS[@]}"
                       
            - store_artifacts:
                path: /root/project/cypress/videos/
                destination: artifact-file
            - store_artifacts:
                path: /root/project/cypress/screenshots/
                destination: artifact-file
      
    terraform-init-then-plan:
        description: "Initializes and run plan from terraform configuration"
        parameters:
            environment:
                type: string
        steps:
            - *attach_workspace
            - checkout
            - run:
                command: |
                    cd ./terraform/<<parameters.environment>>/
                    terraform get -update=true
                    terraform init
                name: get and init
            - run:
                name: plan
                command: |
                    cd ./terraform/<<parameters.environment>>/
                    terraform plan -out=plan.out
            - persist_to_workspace:
                root: *workspace_root
                paths:
                    - .aws
                    - project/*

    terraform-init-then-apply:
        description: "Initialize and apply the terraform configuration"
        parameters:
            environment:
                type: string
        steps:
            - *attach_workspace
            - checkout
            - run:
                  name: get and init
                  command: |
                      cd ./terraform/<<parameters.environment>>/
                      terraform get -update=true
                      terraform init
            - run:
                  name: apply
                  command: |
                      cd ./terraform/<<parameters.environment>>/
                      terraform apply -auto-approve

jobs:
  assume-role-development:
        executor: docker-python
        steps:
            - assume-role-and-persist-workspace:
                  aws-account: $AWS_ACCOUNT_DEVELOPMENT
                  profile-name: default

  assume-role-development-apis:
        executor: docker-python
        steps:
            - assume-role-and-persist-workspace:
                  aws-account: $AWS_ACCOUNT_DEVELOPMENT
                  profile-name: apis
                  attach-existing-workspace: true

  assume-role-staging:
        executor: docker-python
        steps:
            - assume-role-and-persist-workspace:
                  aws-account: $AWS_ACCOUNT_STAGING

  assume-role-production:
        executor: docker-python
        steps:
            - assume-role-and-persist-workspace:
                  aws-account: $AWS_ACCOUNT_PRODUCTION

  run-e2e-tests:
        executor: cypress-browsers
        environment:
            aws-region: eu-west-2
        parameters:
            stage:
                type: string
        steps:
          - when:
              condition: << pipeline.parameters.external_trigger >> 
              steps:
                - *attach_workspace
                - install-system-deps
                - aws-cli/install
                - checkout
                - execute-e2e-tests:
                    stage: <<parameters.stage>>
                    trigger-context: external

  trigger-downstream-deployment:
        executor: cypress-browsers
        environment:
            aws-region: eu-west-2
        parameters:
            stage:
                type: string
        steps:
          - install-system-deps
          - run:
              name: trigger downstream deployment for <<pipeline.parameters.upstream_pipeline_name>>
              command: |
                        export PIPELINE_FILTER="$(echo << pipeline.parameters.upstream_pipeline_name >> | sed 's,https://github.com/,,g')"
                        export DEPLOYMENT_ENVIRONMENT='run_<< parameters.stage >>_workflow' ;
                        curl --location --request POST 'https://circleci.com/api/v2/project/gh/'"$PIPELINE_FILTER"'/pipeline' \
                        --header 'Circle-Token: '"$CIRCLE_TOKEN"'' \
                        --header 'Content-Type: application/json' \
                        --data '{ "branch": "main", "parameters": { "run_development_workflow": false, '\""$DEPLOYMENT_ENVIRONMENT"\"': true } }' ;
  
  run-ci-tests:
        executor: cypress-browsers
        environment:
            aws-region: eu-west-2
        parameters:
            stage:
                type: string
        steps:
          - when:
              condition: << pipeline.parameters.run_workflow_ci >> 
              steps:
                - *attach_workspace
                - install-system-deps
                - aws-cli/install
                - checkout
                - execute-e2e-tests:
                    stage: development
                    trigger-context: ci
        
  run-e2e-devices:
        executor: cypress-browsers
        environment:
            aws-region: eu-west-2
        parameters:
            stage:
                type: string
        steps:
          - *attach_workspace
          - install-system-deps
          - aws-cli/install
          - checkout
          - execute-e2e-tests:
              stage: staging
              trigger-context: devices

  terraform-init-and-plan-development:
        executor: docker-terraform
        steps:
        - terraform-init-then-plan:
            environment: "development"
  
  terraform-apply-development:
        executor: docker-terraform
        steps:
        - terraform-init-then-apply:
            environment: "development"
    
workflows:
  deploy-terraform-development:
    jobs:
      - permit-development-terraform-workflow:
          type: approval
          filters:
            branches:
              only:
                - feat/ssi-1171-rollout-cognito-auth
      - assume-role-development:
          context: api-assume-role-housing-development-context     
          requires:
            - permit-development-terraform-workflow
      - assume-role-development-apis:
          context: api-assume-role-development-context
          requires:
            - assume-role-development
      - terraform-init-and-plan-development:
            requires:
                - assume-role-development-apis
      - permit-development-terraform-deployment:
            type: approval
            requires:
                - terraform-init-and-plan-development
      - terraform-apply-development:
            requires:
                - permit-development-terraform-deployment
      
